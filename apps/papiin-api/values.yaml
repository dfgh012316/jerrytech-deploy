customSelectorLabels:
  app: "papiin-api"
image:
  repository: "dfgh012316/papiin-api"
  tag: "746b4eb"
service:
  targetPort: 8080
ingress:
  enabled: false
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 5
secret:
  enabled: true
configMap:
  enabled: true
  data:
    CORS_ALLOWED_ORIGINS: "https://papiin.jerrytech.me,https://papiin-dashboard.jerrytech.me"
    SESSION_COOKIE_DOMAIN: ".jerrytech.me"
    # Base URL for user-facing links the API generates (e.g. join-link URLs
    # /join/projects/{token}). Must point at the frontend origin; the code
    # default is http://localhost:8080.
    APP_BASE_URL: "https://papiin.jerrytech.me"
    # All external traffic enters via the cloudflared pod, so its pod-CIDR
    # range must be trusted for X-Forwarded-For — otherwise every visitor
    # rate-limits and audits as the pod IP (one shared bucket site-wide).
    # 10.42.0.0/16 is the k3s cluster pod CIDR (node currently 10.42.0.0/24).
    TRUSTED_PROXIES: "10.42.0.0/16"
    # Per-client token bucket, now keyed by real client IP. Code defaults
    # (600/h, burst 20) are too tight for the SPA dashboard.
    RATE_LIMIT_RPS: "1"
    RATE_LIMIT_BURST: "50"
    # Temporary: lets the frontend bypass PaPiin SSO via /api/v1/auth/dev-login
    # while PaPiin's JWT exchange is unavailable. Flip to "false" before treating
    # this deployment as production. See docs/integration/dev-login-for-frontend.md
    # in the papiin repo.
    DEV_LOGIN_ENABLED: "true"
    # Serves Swagger UI at /docs from the openapi.yaml baked into the image.
    # Defaults to on in ENV=dev; the API refuses to boot if this is "true" in a
    # production-like ENV. Set OPENAPI_SPEC_PATH to where the Dockerfile copied
    # the spec.
    OPENAPI_SPEC_PATH: "/openapi.yaml"
migrations:
  enabled: true
