{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "helm-chart.fullname" . }}-{{ .Values.cronjob.name | default "job" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
spec:
  schedule: {{ required "cronjob.schedule is required when cronjob.enabled" .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit | default 1 }}
      template:
        metadata:
          labels:
            {{- include "helm-chart.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Values.cronjob.name | default "job" }}
              image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                {{- toYaml .Values.cronjob.command | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: common-config
                {{- if .Values.configMap.enabled }}
                - configMapRef:
                    name: {{ include "helm-chart.fullname" . }}
                {{- end }}
                {{- if .Values.secret.enabled }}
                - secretRef:
                    name: {{ include "helm-chart.fullname" . }}
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              {{- if .Values.securityContext.readOnlyRootFilesystem }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              {{- end }}
          {{- if .Values.securityContext.readOnlyRootFilesystem }}
          volumes:
            - name: tmp
              emptyDir: {}
          {{- end }}
{{- end }}
