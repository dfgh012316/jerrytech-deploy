apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popofinder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dfgh012316/jerrytech-deploy
    targetRevision: HEAD
    path: charts/app
    helm:
      valueFiles:
        - ../../apps/popofinder/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: popo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true