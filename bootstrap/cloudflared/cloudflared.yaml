apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        # 釘版本：:latest 會讓每次重啟都重拉 image，也會默默升版
        image: cloudflare/cloudflared:2026.10.4
        imagePullPolicy: IfNotPresent
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: tunnel-token
              key: token
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          # cloudflared 斷線會自己重連；給 60 秒緩衝，短暫斷網不要重啟它
          failureThreshold: 6
          initialDelaySeconds: 10
          periodSeconds: 10
