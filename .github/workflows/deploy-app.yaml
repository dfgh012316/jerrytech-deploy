name: Deploy app

# push-based 部署入口。兩種觸發：
#   1) repository_dispatch (type: deploy-app) — app repo build 完 image 後發來（帶 app/tag）
#   2) workflow_dispatch — 手動重部署 / 接管現有 release（可只 deploy 不改 tag）
#
# job1 commit-tag：在 GitHub-hosted 上 bump apps/<app>/values.yaml 的 image.tag（內建 GITHUB_TOKEN）
# job2 deploy    ：在 in-cluster self-hosted runner 上 helm upgrade（讀剛 push 的 commit）
on:
  repository_dispatch:
    types: [deploy-app]
  workflow_dispatch:
    inputs:
      app:
        description: 'app 名（popofinder / slipkit）'
        required: true
        type: string
      tag:
        description: 'image tag（留空則不改 tag，只重跑 helm 接管現有 values）'
        required: false
        type: string

jobs:
  commit-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app: ${{ steps.r.outputs.app }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # 外部輸入一律經 env 傳進 shell，不在 run: 裡直接展開 ${{ }}（避免 template injection）。
      # 驗證通過才寫進 $GITHUB_OUTPUT，後面的 step / job 只讀驗證過的值。
      - name: Resolve & validate inputs（dispatch / manual 兩種來源）
        id: r
        env:
          APP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.app || inputs.app }}
          TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
        run: |
          case "$APP" in
            popofinder|slipkit) : ;;
            *) echo "::error::app 不在 allowlist（popofinder / slipkit）"; exit 1 ;;
          esac
          # 空值 = 不改 tag；其餘必須符合 Docker tag 語法（整串比對，換行也會被擋）
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::tag 格式不合法（需符合 [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}）"; exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Bump image tag（有給 tag 才改）
        if: ${{ steps.r.outputs.tag != '' }}
        env:
          APP: ${{ steps.r.outputs.app }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          yq e -i '.image.tag = strenv(TAG)' "apps/$APP/values.yaml"

      - name: Commit & push
        id: push
        env:
          APP: ${{ steps.r.outputs.app }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "values 無變更（tag 相同或未給），沿用現有 commit"
          else
            git add "apps/$APP/values.yaml"
            git commit -m "chore($APP): update image tag to $TAG"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: commit-tag
    runs-on: [self-hosted, pi, k3s]
    steps:
      - name: Checkout（含剛 push 的 tag commit）
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.commit-tag.outputs.sha }}

      - name: Helm upgrade
        env:
          APP: ${{ needs.commit-tag.outputs.app }}
        run: |
          chmod +x scripts/deploy-app.sh
          ./scripts/deploy-app.sh "$APP"

      - name: Summary
        if: always()
        env:
          APP: ${{ needs.commit-tag.outputs.app }}
          SHA: ${{ needs.commit-tag.outputs.sha }}
        run: |
          echo "### Deploy $APP 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
