customSelectorLabels:
  app: "popofinder"
image:
  repository: "dfgh012316/popofinder"
  tag: "93e7077"
ingress:
  enabled: false
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
secret:
  enabled: true
migrations:
  enabled: true
configMap:
  enabled: true
  data:
    ENVIRONMENT: "production"
    DB_NAME: "popo"
    DB_USER: "postgres"
cronjob:
  enabled: true
  name: "reconcile"
  # 每月 1 號 04:00 UTC (≈ 台北 12:00) 重爬 blog 對帳回填來源、補新通報
  schedule: "0 4 1 * *"
  command:
    - /reconcile
