name: Deploy app

# push-based 部署入口。兩種觸發：
#   1) repository_dispatch (type: deploy-app) — app repo build 完 image 後發來（帶 app/tag）
#   2) workflow_dispatch — 手動重部署 / 接管現有 release（可只 deploy 不改 tag）
#
# job1 commit-tag：在 GitHub-hosted 上 bump apps/<app>/values.yaml 的 image.tag（內建 GITHUB_TOKEN）
# job2 deploy    ：在 in-cluster self-hosted runner 上 helm upgrade（讀剛 push 的 commit），
#                  有設定 cdn 的 app 再清 Cloudflare 快取＋預熱（scripts/cdn-refresh.sh）
# job3 notify    ：在 GitHub-hosted 上把結果（含快取清了沒）發到 Discord（secret DISCORD_WEBHOOK_URL）
on:
  repository_dispatch:
    types: [deploy-app]
  workflow_dispatch:
    inputs:
      app:
        description: 'app 名（popofinder / slipkit / opencourt / openlawmaker）'
        required: true
        type: string
      tag:
        description: 'image tag（留空則不改 tag，只重跑 helm 接管現有 values）'
        required: false
        type: string

# 預設只給 GITHUB_TOKEN 讀權限；需要寫的 job 各自宣告
permissions:
  contents: read

jobs:
  commit-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app: ${{ steps.r.outputs.app }}
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      # 外部輸入一律經 env 傳進 shell，不在 run: 裡直接展開 ${{ }}（避免 template injection）。
      # 驗證通過才寫進 $GITHUB_OUTPUT，後面的 step / job 只讀驗證過的值。
      - name: Resolve & validate inputs（dispatch / manual 兩種來源）
        id: r
        env:
          APP: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.app || inputs.app }}
          TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
        run: |
          case "$APP" in
            popofinder|slipkit|opencourt|openlawmaker) : ;;
            *) echo "::error::app 不在 allowlist（popofinder / slipkit / opencourt / openlawmaker）"; exit 1 ;;
          esac
          # 空值 = 不改 tag；其餘必須符合 Docker tag 語法（整串比對，換行也會被擋）
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::tag 格式不合法（需符合 [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}）"; exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # Commit & push 要用 GITHUB_TOKEN push（GitHub-hosted，job 結束即銷毀）

      - name: Bump image tag（有給 tag 才改）
        if: ${{ steps.r.outputs.tag != '' }}
        env:
          APP: ${{ steps.r.outputs.app }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          yq e -i '.image.tag = strenv(TAG)' "apps/$APP/values.yaml"

      - name: Commit & push
        id: push
        env:
          APP: ${{ steps.r.outputs.app }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "values 無變更（tag 相同或未給），沿用現有 commit"
          else
            git add "apps/$APP/values.yaml"
            git commit -m "chore($APP): update image tag to $TAG"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: commit-tag
    runs-on: [self-hosted, pi, k3s]
    outputs:
      cdn: ${{ steps.cdn.outputs.result }}       # none／no-token／purged；清除失敗時是空的
      cdn_outcome: ${{ steps.cdn.outcome }}      # continue-on-error 下失敗仍是 failure（conclusion 才會變 success）
    steps:
      - name: Checkout（含剛 push 的 tag commit）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit-tag.outputs.sha }}
          persist-credentials: false   # 常駐 runner：不把 token 留在 _work 的 .git/config

      - name: Helm upgrade
        env:
          APP: ${{ needs.commit-tag.outputs.app }}
        run: |
          chmod +x scripts/deploy-app.sh
          ./scripts/deploy-app.sh "$APP"

      # helm --wait 結束時新的 Pod 已經在服務：這時清掉 Cloudflare 上的舊頁面與舊 API 回應，再預熱幾個入口。
      # 只有 _registry.yaml 裡有 cdn 的 app 會做；沒有 token 時只印警告。失敗不讓部署算失敗（服務已經換好），
      # 但 run 上看得到。
      - name: Refresh CDN（清 Cloudflare 快取＋預熱）
        id: cdn
        continue-on-error: true
        env:
          APP: ${{ needs.commit-tag.outputs.app }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          chmod +x scripts/cdn-refresh.sh
          ./scripts/cdn-refresh.sh "$APP"

      - name: Summary
        if: always()
        env:
          APP: ${{ needs.commit-tag.outputs.app }}
          SHA: ${{ needs.commit-tag.outputs.sha }}
        run: |
          echo "### Deploy $APP 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # 跑在 GitHub 的機器上，不是 Pi 上的 runner：commit-tag 失敗、或 runner 在部署中途掛掉時也照樣會發。
  # app／tag 只用 commit-tag 驗證過的 output（驗證沒過時是空的）。
  notify:
    needs: [commit-tag, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP: ${{ needs.commit-tag.outputs.app }}
          TAG: ${{ needs.commit-tag.outputs.tag }}
          DEPLOY: ${{ needs.deploy.result }}
          CDN: ${{ needs.deploy.outputs.cdn }}
          CDN_OUTCOME: ${{ needs.deploy.outputs.cdn_outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TAG" ]; then ver="\`$TAG\`"; else ver='（沿用原本的 tag）'; fi
          case "$DEPLOY" in
            success)
              case "$CDN_OUTCOME/$CDN" in
                failure/*)  msg="⚠️ $APP 已上線 $ver，但清 Cloudflare 快取失敗：讀者可能還會看到舊的頁面一段時間" ;;
                */no-token) msg="⚠️ $APP 已上線 $ver，但沒有 CLOUDFLARE_PURGE_TOKEN，Cloudflare 快取沒有清" ;;
                */purged)   msg="✅ $APP 已上線 $ver，Cloudflare 快取已清除並預熱" ;;
                *)          msg="✅ $APP 已上線 $ver" ;;
              esac ;;
            skipped) msg="🔴 部署沒有開始：commit-tag 失敗（app／tag 驗證沒過，或 push 被拒）" ;;
            *)       msg="🔴 $APP 部署失敗（$DEPLOY）" ;;
          esac
          msg=$(printf '%s\n<%s>' "$msg" "$RUN_URL")
          jq -n --arg c "$msg" '{content: $c, allowed_mentions: {parse: []}}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$DISCORD_WEBHOOK_URL"
