name: Update Image Tag

on:
  workflow_call:
    inputs:
      app:
        required: false
        type: string
        default: ''
      tag:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source repository
        run: |
          ALLOWED_REPOS=("dfgh012316/popofinder")
          SOURCE_REPO="${{ github.event.repository.full_name }}"

          for repo in "${ALLOWED_REPOS[@]}"; do
            if [ "$repo" == "$SOURCE_REPO" ]; then
              echo "✅ Source repository $SOURCE_REPO is allowed"
              exit 0
            fi
          done

          echo "❌ Source repository $SOURCE_REPO is not in the whitelist"
          exit 1

      - name: Resolve app name
        id: resolve
        run: |
          if [ -n "${{ inputs.app }}" ]; then
            APP="${{ inputs.app }}"
          else
            APP="${{ github.event.repository.full_name }}"
            APP="${APP##*/}"
          fi
          echo "app=$APP" >> $GITHUB_OUTPUT

      - name: Validate image exists on DockerHub
        run: |
          APP="${{ steps.resolve.outputs.app }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/dfgh012316/${APP}/tags/${{ inputs.tag }}/")

          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Image dfgh012316/${APP}:${{ inputs.tag }} exists on DockerHub"
          else
            echo "❌ Image dfgh012316/${APP}:${{ inputs.tag }} not found on DockerHub (HTTP ${HTTP_STATUS})"
            exit 1
          fi

  update:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve app name
        id: resolve
        run: |
          if [ -n "${{ inputs.app }}" ]; then
            APP="${{ inputs.app }}"
          else
            APP="${{ github.event.repository.full_name }}"
            APP="${APP##*/}"
          fi
          echo "app=$APP" >> $GITHUB_OUTPUT

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: dfgh012316
          repositories: jerrytech-deploy

      - name: Checkout jerrytech-deploy
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: dfgh012316/jerrytech-deploy

      - name: Update image tag
        run: |
          yq e '.image.tag = "${{ inputs.tag }}"' -i apps/${{ steps.resolve.outputs.app }}/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/${{ steps.resolve.outputs.app }}/values.yaml
          git commit -m "chore(${{ steps.resolve.outputs.app }}): update image tag to ${{ inputs.tag }}"
          git push

      - name: Job Summary
        if: always()
        run: |
          echo "### Update Image Tag Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| App | ${{ steps.resolve.outputs.app }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ inputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Repo | ${{ github.event.repository.full_name }} |" >> $GITHUB_STEP_SUMMARY
