image:
  repository: "dfgh012316/popofinder"
  tag: "bd67c36"
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
secret:
  enabled: true
migrations:
  enabled: true
configMap:
  enabled: true
  data:
    ENVIRONMENT: "production"
    DB_NAME: "popo"
    DB_USER: "popo_app"
cronjob:
  # 醫院官網爬蟲（popofinder docs/open-decisions.md OD-7、OD-10），目前只有亞東（femh）。
  # 先用 -dry-run：只在 log 印計畫數量、不寫 DB；看過正式數字再拿掉 -dry-run。
  # 同一 host 每秒最多 1 個請求，爬一輪約 15–30 分鐘；失敗會重試 1 次（chart 的 backoffLimit 預設）。
  # chart 只支援一個 CronJob：原本的 reconcile 已於 2026-10-12 停用（上游 blog 自 2025-03 凍結；
  # 資料清理後 (姓名+醫院) 不再與 blog 一致，重跑會重複 INSERT），這個位置改給 crawl。
  enabled: true
  name: "crawl"
  # 每月 1 號 19:00 UTC = 台北 2 號 03:00（醫院網站離峰）
  schedule: "0 19 1 * *"
  command:
    - /crawl
    - -sources
    - femh
