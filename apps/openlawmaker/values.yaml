# OpenLawMaker（立委質詢摘要、議題、搜尋）：資料存共用 PostgreSQL（db openlawmaker，role openlawmaker_app）。
# Secret openlawmaker 手動建立：DATABASE_URL、OPENAI_API_KEY（摘要用，使用者自己的 OpenAI 帳號）。
# 對外 openlawmaker.jerrytech.me → http://openlawmaker.openlawmaker.svc:80（Cloudflare Tunnel 後台）。
imagePullSecrets:
  - name: ghcr-pull
image:
  repository: "ghcr.io/dfgh012316/openlawmaker"
  # 由 deploy-app.yaml 在每次部署時改寫。
  tag: "ae4bc42"
# Deployment 與 CronJob 共用。server 平常約 80Mi（委員照片、字型常駐），畫分享圖時更高；每日排程讀整份 IVOD 列表（約 40MB 原始 JSON）時較高。
# limits 2026-11-08 從 500m／384Mi 放寬：沒命中 Cloudflare 快取的請求每秒約 0.3 個時，500m 在有在跑的 CFS 週期裡 88% 被 throttle，
# 分享圖一度要等 27 秒，記憶體尖峰 294Mi。Pi 4 核平常只用約 0.3 核、可用記憶體約 5.8GB。
resources:
  limits:
    cpu: "2"
    memory: 768Mi
  requests:
    cpu: 50m
    memory: 64Mi
environment: "production"
env:
  # 獻金與標案區塊：律師看過前不開（不設 SHOW_MONEY）。
  # 每天送出發言摘要的估價上限（美元）；每天新發言約 25 段、約 $0.25。
  - name: DAILY_MAX_USD
    value: "1"
commonConfigMapName: ""
secret:
  enabled: true
migrations:
  enabled: true
cronjob:
  enabled: true
  name: daily
  # 台北 04:00：抓前一天的發言、會議、議案、表決，送出新發言的摘要。叢集照台北時間解讀 schedule
  # （chart 沒有 timeZone；原本寫 "0 20 * * *" 以為是 UTC，實際每天台北 20:00 跑，2026-11-05 Job 名稱 29898000 分鐘＝12:00Z）。
  # 放在半夜：讀者最少（2026-11-05 晚間那次四個網站停擺約 4 分鐘，當時正在部署又在上傳批次，原因沒有查到）。
  schedule: "0 4 * * *"
  command: ["/daily"]
  # 失敗不重試：/daily 一步失敗會繼續跑完其他步驟、最後非零結束，重試等於整套（含上傳批次）再跑一次
  # （2026-11-05 因此跑了 92 分鐘）。各步驟是增量的，失敗的那一步隔天的排程會補；留下失敗的 Pod 看 log。
  backoffLimit: 0
  restartPolicy: Never
