apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        # 釘版本：:latest 會讓每次重啟都重拉 image，也會默默升版
        image: cloudflare/cloudflared:2026.10.4
        imagePullPolicy: IfNotPresent
        args:
        - tunnel
        - --no-autoupdate
        # 協定用預設的 QUIC。2026-11-05 試過 --protocol http2（懷疑 UDP 緩衝上限 208 KB 讓 QUIC 變慢，cloudflared 啟動時會警告
        # 「wanted 7168 kiB, got 416 kiB」）：經 tunnel 往外的速度沒有變快（QUIC 約 50–75 KB/s，HTTP/2 約 46–51 KB/s），所以改回來。
        - --metrics
        - 0.0.0.0:2000
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: tunnel-token
              key: token
        # 連上 Cloudflare 才算就緒（/ready 有連線時回 200）：rolling update 時新的連不上，舊的就不會被收掉。
        # cloudflared 前面沒有 Service，就緒與否不影響流量，只影響更新。
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          # cloudflared 斷線會自己重連；給 60 秒緩衝，短暫斷網不要重啟它
          failureThreshold: 6
          initialDelaySeconds: 10
          periodSeconds: 10
