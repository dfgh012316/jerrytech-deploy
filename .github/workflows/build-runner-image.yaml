name: Build runner image

# 自訂 in-cluster self-hosted runner image（arm64）→ 推到 GHCR。
# 用 GitHub-hosted runner + QEMU build，不依賴 self-hosted runner（避免雞生蛋）。
# workflow_call：runner-auto-update.yaml bump 版本後直接呼叫（GITHUB_TOKEN 的 push 不會觸發上面的 push）。
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/actions-runner/image/**'
      - '.github/workflows/build-runner-image.yaml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: '要 build 的 commit（bump 後的 sha）'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bootstrap/actions-runner/image
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dfgh012316/jerrytech-runner:latest
            ghcr.io/dfgh012316/jerrytech-runner:${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          {
            echo "### Runner image 🏗️"
            echo "- \`ghcr.io/dfgh012316/jerrytech-runner:latest\`"
            echo "- \`ghcr.io/dfgh012316/jerrytech-runner:$REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
