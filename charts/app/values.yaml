# Values are validated against values.schema.json: unknown top-level keys are rejected.

# -- Replica count for the deployment
replicaCount: 1

# -- Number of old ReplicaSets to retain for rollback (Kubernetes default: 10)
revisionHistoryLimit: 3

# -- Container image configuration. repository and tag are both required (no
# fallback): tag is written by CI (deploy-app.yaml) on every deploy.
image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Network service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# -- Resource limits and requests (also applied to the migrations init container)
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Startup / Liveness / Readiness probes.
# liveness 打靜態 /health（永不查相依）；readiness 與 startup 打 /readyz（查 DB）。
# startup 通過前 liveness 不啟動，故 liveness initialDelaySeconds 設 0。
probes:
  startup:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# -- Cluster-wide ConfigMap every workload loads via envFrom (DB_HOST / DB_PORT ...).
# Must already exist in the app namespace (see bootstrap/common-config/). Set "" to skip.
commonConfigMapName: "common-config"

# -- ConfigMap data (optional)
configMap:
  enabled: false
  data: {}

# -- Load the pre-created Secret named after the release via envFrom.
# The chart does NOT create the Secret (kubectl create secret ...; never in git).
secret:
  enabled: true

# -- Deployment environment label (exposed to the container as ENV).
# Override per-app (e.g. "production", "staging") when the default isn't appropriate.
environment: "dev"

# -- Environment variables and secrets.
# APP_VERSION (= image.tag) and ENV (= .Values.environment) are injected by the
# chart automatically; entries listed here override them by name.
env: []
envFrom: []

# -- Default Container Security Context (Strict)
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# -- Security Exception (RD override). Applies to the app container only.
securityException:
  enabled: false
  # When enabled, you can provide overrides here
  # context:
  #   runAsNonRoot: false
  #   runAsUser: 0
  #   readOnlyRootFilesystem: false

# -- DB Migration via init container (runs migrate up before app starts).
# Contract with the image: /migrate binary + /migrations dir + DATABASE_URL in the release Secret.
# The init container always uses the baseline securityContext and the app's resources.
migrations:
  enabled: false

# -- Optional CronJob (e.g. periodic data reconcile). Disabled by default.
# Reuses the app image, securityContext, resources, env and envFrom.
cronjob:
  enabled: false
  # Suffix appended to the fullname for the CronJob/container name.
  name: "job"
  # Cron schedule (cluster default timezone = UTC). Required when enabled.
  schedule: ""
  # Container command (e.g. ["/reconcile"]).
  command: []
  backoffLimit: 1

# -- Additional Pod configuration
podAnnotations: {}
podLabels: {}
