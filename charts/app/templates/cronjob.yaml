{{- if .Values.cronjob.enabled }}
{{- $jobName := printf "%s-%s" (include "helm-chart.fullname" .) .Values.cronjob.name }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
spec:
  schedule: {{ required "cronjob.schedule is required when cronjob.enabled" .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit | default 1 }}
      template:
        metadata:
          labels:
            {{- /* Must NOT reuse selectorLabels: the Service selects on `app: <release>` and would route traffic to job pods. */}}
            app: {{ $jobName }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: {{ .Values.cronjob.name }}
              image: {{ include "helm-chart.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                {{- toYaml .Values.cronjob.command | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                {{- include "helm-chart.env" . | nindent 16 }}
              envFrom:
                {{- include "helm-chart.envFrom" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              {{- if .Values.securityContext.readOnlyRootFilesystem }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              {{- end }}
          {{- if .Values.securityContext.readOnlyRootFilesystem }}
          volumes:
            - name: tmp
              emptyDir: {}
          {{- end }}
{{- end }}
