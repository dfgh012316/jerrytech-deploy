name: Build runner image

# 自訂 in-cluster self-hosted runner image（arm64）→ 推到 GHCR。
# 用 GitHub-hosted runner + QEMU build，不依賴 self-hosted runner（避免雞生蛋）。
# workflow_call：runner-auto-update.yaml bump 版本後直接呼叫（GITHUB_TOKEN 的 push 不會觸發上面的 push）。
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/actions-runner/image/**'
      - '.github/workflows/build-runner-image.yaml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: '要 build 的 commit（bump 後的 sha）'
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: bootstrap/actions-runner/image
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dfgh012316/jerrytech-runner:latest
            ghcr.io/dfgh012316/jerrytech-runner:${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Runner image 🏗️"
            echo "- \`ghcr.io/dfgh012316/jerrytech-runner:latest\`"
            echo "- \`ghcr.io/dfgh012316/jerrytech-runner:${{ inputs.ref || github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
