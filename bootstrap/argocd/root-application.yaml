apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dfgh012316/jerrytech-deploy
    targetRevision: HEAD
    path: apps
    directory:
      recurse: true
      # glob is matched against the path relative to spec.source.path, so a
      # bare 'application.yaml' matches nothing under apps/<name>/
      include: '*/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
