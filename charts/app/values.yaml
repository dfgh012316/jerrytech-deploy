# -- Replica count for the deployment
replicaCount: 1

# -- Number of old ReplicaSets to retain for rollback (Kubernetes default: 10)
revisionHistoryLimit: 3

# -- Container image configuration
image:
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Network service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# -- Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  # Required when enabled and hosts is not set
  host: ""
  # Optional: manually specify multiple hosts with custom paths
  hosts: []
  # Optional: custom TLS configuration, defaults to jerrytech-wildcard-tls
  tls: []

# -- Resource limits and requests
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Liveness and Readiness probes
probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 5

# -- ConfigMap data (optional)
configMap:
  enabled: false
  data: {}

# -- Secret configuration (enabled by default for app-specific secrets)
secret:
  enabled: true

# -- Deployment environment label (exposed to the container as ENV).
# Override per-app (e.g. "production", "staging") when the default isn't appropriate.
environment: "dev"

# -- Environment variables and secrets.
# APP_VERSION (= image.tag) and ENV (= .Values.environment) are injected by the
# chart automatically; entries listed here override them by name.
env: []
envFrom: []

# -- Default Container Security Context (Strict)
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# -- Security Exception (RD override)
securityException:
  enabled: false
  # When enabled, you can provide overrides here
  # context:
  #   runAsNonRoot: false
  #   runAsUser: 0
  #   readOnlyRootFilesystem: false

# -- DB Migration via init container (runs migrate up before app starts)
migrations:
  enabled: false

# -- Optional CronJob (e.g. periodic data reconcile). Disabled by default.
# Reuses the app image, securityContext and envFrom (configMaps + secret).
cronjob:
  enabled: false
  # Suffix appended to the fullname for the CronJob/container name.
  name: "job"
  # Cron schedule (cluster default timezone = UTC). Required when enabled.
  schedule: ""
  # Container command (e.g. ["/reconcile"]).
  command: []
  backoffLimit: 1

# -- Additional Pod configuration
podAnnotations: {}
podLabels: {}
