apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-feed
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dfgh012316/jerrytech-deploy
    targetRevision: HEAD
    path: charts/app
    helm:
      valueFiles:
        - ../../apps/agent-feed/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-feed
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
