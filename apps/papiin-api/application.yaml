apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: papiin-api
  namespace: argocd
  # Ensures root prune of this Application cascades to managed workloads
  # (Deployment/Service/ConfigMap/etc.) instead of leaving orphans.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/dfgh012316/jerrytech-deploy
    targetRevision: HEAD
    path: charts/app
    helm:
      valueFiles:
        - ../../apps/papiin-api/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: papiin-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
