customSelectorLabels:
  app: "slipbox"
image:
  repository: "dfgh012316/slipbox"
  tag: "2062c75"
ingress:
  enabled: false
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 10
configMap:
  enabled: false
secret:
  enabled: true
securityException:
  enabled: true
  context:
    readOnlyRootFilesystem: false
