# 網開一面（opencourt）：無 DB，上游資料只存在記憶體；Secret opencourt 放 LINE 憑證（LINE_MESSAGE_CHANNEL_SECRET、LINE_MESSAGE_CHANNEL_ACCESS_TOKEN），手動建立。
imagePullSecrets:
  - name: ghcr-pull
image:
  repository: "ghcr.io/dfgh012316/opencourt"
  # 由 deploy-app.yaml 在每次部署時改寫；第一次 CI 部署前不會被使用。
  tag: "0dc7731"
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi
environment: "production"
env:
  # 卡片按鈕開的網址：網開一面 MINI App（LIFF ID 2011903357-xLZtwPYK，endpoint https://opencourt.jerrytech.me/）。
  - name: PUBLIC_URL
    value: "https://miniapp.line.me/2011903357-xLZtwPYK"
commonConfigMapName: ""
secret:
  enabled: true
